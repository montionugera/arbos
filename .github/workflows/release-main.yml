name: Release main

# Every green commit on `main` becomes an installable, signed build of Arbos,
# with no human picking a version number and no human pressing anything.
#
# There is one channel, `main`, and one document the app fetches:
#   https://github.com/unarbos/arbos/releases/download/edge/manifest.json
#
# ── the version ──────────────────────────────────────────────────────────────
# `0.2.112` out of app/Cargo.toml, and behind it the count of commits on the
# branch: `0.2.112.1877`. The pair is what the binary already reports
# (ARBOS_BUILD at compile time) and what the bundle carries, so nothing is
# invented for the manifest, and `0.2.112.1877` sorts above `0.2.112.1876`
# without anybody deciding anything. The short SHA rides along so a build can
# be traced to its commit.
#
# ── never a red build ────────────────────────────────────────────────────────
# The trigger is `workflow_run` on CI, and the jobs run only when that run
# concluded `success` on a push to `main`. There is no path from a red commit
# to a published payload.
#
# ── safe to re-run ───────────────────────────────────────────────────────────
# Re-running publishes the same version and build again: the manifest is
# rewritten and a fresh `edge` release replaces the one that is there. Running
# it twice leaves exactly what running it once leaves, with a newer date.
#
# ── one writer ───────────────────────────────────────────────────────────────
# This is the only workflow that touches the `edge` release. Several commits
# can land at once and each starts a run; the concurrency group serialises
# them and never cancels a running publish, and GitHub keeps only the newest
# run waiting, so a burst of merges collapses into the newest build.
#
# ── signing ──────────────────────────────────────────────────────────────────
# What makes a payload safe to install is the Ed25519 signature the manifest
# carries over its bytes, checked by the app against the public key compiled
# into it (app/crates/update/update-key.pub). That promise is ours to make and
# needs nothing from Apple, which is why this works today.
#
# Apple's signature is a second, separate promise, about what Gatekeeper does
# to a copy somebody downloads in a browser. `.github/actions/macos-payload`
# makes whichever of it is possible:
#
#   a "Developer ID Application" certificate   signed, notarized, stapled
#   any other Apple certificate                signed (notarytool takes only a
#                                              Developer ID certificate)
#   none                                       ad-hoc signed — what a fork gets,
#                                              and the updater installs it
#
# Notarization, once it is possible, is not allowed to fail quietly: the macOS
# job fails and nothing is published, rather than a payload going out that
# Gatekeeper would reject.
#
# ── secrets ──────────────────────────────────────────────────────────────────
#   ARBOS_UPDATE_SIGNING_KEY   required: the private half of the update key,
#                              base64. Without it this workflow skips itself
#                              with a note rather than publishing something
#                              every app would refuse.
#   DEVELOPER_ID_CERT_P12 + P12_PASSWORD           the Apple certificate
#   NOTARY_KEY_P8 + NOTARY_KEY_ID + NOTARY_ISSUER_ID   App Store Connect API
#                                                      key, for notarization
#
# Everything hangs off one rolling pre-release tagged `edge`. The tag is a
# container, not a version, and the name is the only constant: on every
# publish the release is rebuilt from nothing and the tag is moved to the
# commit that was built, so the date on the releases page is the date of this
# build and not the day the tag was first made. The asset names and the
# download URLs (`releases/download/edge/...`) do not change, so a shipped app
# never has to be told where to look next.
#
# The swap is staged so the channel is never left empty by a bad run: the
# payloads go onto an invisible draft first, and only once every byte is up is
# the old release taken down and the draft published as `edge`. A failed
# upload leaves the old release exactly as it was.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: edge

jobs:
  # What is being published, worked out once so the three jobs below name the
  # same files. The build number is a commit count, and a shallow checkout
  # would count differently in each job.
  plan:
    name: What to publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      HAVE_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY != '' }}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      short: ${{ steps.plan.outputs.short }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        run: |
          set -euo pipefail
          if [ "$HAVE_KEY" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release main not set up::ARBOS_UPDATE_SIGNING_KEY is not set, so nothing was published. Run \`cargo run -p zeron-update --bin arbos-updatectl -- keygen\` once, commit the public line to app/crates/update/update-key.pub, and store the secret."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          # The subject of the commit. For a merge that is the PR's own title,
          # which is the sentence worth showing next to an Update button.
          {
            echo "notes<<ARBOS_EOF"
            git log -1 --format=%s
            echo "ARBOS_EOF"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Arbos app (macOS arm64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      signing: ${{ steps.payload.outputs.signing }}
      notarized: ${{ steps.payload.outputs.notarized }}
      stapled: ${{ steps.payload.outputs.stapled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Rust toolchain
        working-directory: app
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
          key: release-main-macos
          cache-on-failure: true
      # The bundle carries fx (scripts/package-macos.sh builds ../fx with
      # this toolchain), so one update brings the app and the agent together.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - id: payload
        uses: ./.github/actions/macos-payload
        with:
          build: ${{ needs.plan.outputs.build }}
          developer-id-p12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          developer-id-p12-password: ${{ secrets.P12_PASSWORD }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
      - name: Collect
        env:
          PAYLOAD: ${{ steps.payload.outputs.path }}
          SIGNING: ${{ steps.payload.outputs.signing }}
          NOTARIZED: ${{ steps.payload.outputs.notarized }}
          STAPLED: ${{ steps.payload.outputs.stapled }}
          NOTARY_LOGS: ${{ steps.payload.outputs.notary-logs }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PAYLOAD" dist/
          # An unstapled payload travels with its notarization logs, so the
          # release page shows Apple's verdict on the exact build.
          if [ -n "$NOTARY_LOGS" ]; then
            cp $NOTARY_LOGS dist/
          fi
          ls -la dist
          echo "macOS payload \`$(basename "$PAYLOAD")\` — Apple signature \`$SIGNING\`, notarized \`$NOTARIZED\`, stapled \`$STAPLED\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: payload-macos
          # Only the tarball and, for an unstapled build, the notarization
          # logs. Nothing secret is ever in the workspace — the certificate
          # is decoded into $RUNNER_TEMP and deleted — but the globs are
          # narrow anyway.
          path: |
            dist/*.tar.gz
            dist/notarization-*.log
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Arbos (Linux x86_64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Rust toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
          key: release-main-linux
          cache-on-failure: true
      - id: payload
        uses: ./.github/actions/linux-payload
        with:
          build: ${{ needs.plan.outputs.build }}
          # An optimised desktop. The debug profile the retired Linux tarball
          # workflow shipped weighed 879 MB on the edge release.
          profile: release
      - name: Collect
        env:
          PAYLOAD: ${{ steps.payload.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PAYLOAD" dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [plan, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}.${{ needs.plan.outputs.build }}
      SHA: ${{ needs.plan.outputs.sha }}
      SHORT: ${{ needs.plan.outputs.short }}
      SIGNING: ${{ needs.macos.outputs.signing }}
      NOTARIZED: ${{ needs.macos.outputs.notarized }}
      STAPLED: ${{ needs.macos.outputs.stapled }}
      REPO: ${{ github.repository }}
      # Where the new release is assembled before it becomes `edge`. A draft
      # never creates a tag and is invisible to anyone without write access,
      # so this name is never fetched by anything.
      STAGING: edge-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Rust toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
          key: release-main-publish
          cache-on-failure: true
      # The tool that measures and signs, built from the same commit as the
      # app, so the public key it verifies against is the one that app has.
      - name: Build arbos-updatectl
        working-directory: app
        run: cargo build --locked -p zeron-update --bin arbos-updatectl
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What is on the release now, for the log and for a warning if this run
      # would publish something older than it. On the first run, or after a
      # publish that was interrupted between taking down and putting up, there
      # is no release yet and that is fine.
      - name: The manifest already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          if gh release download "$TAG" --pattern manifest.json --dir previous 2>/dev/null; then
            was="$(jq -r '.version // empty' previous/manifest.json)"
            echo "replacing $was with $VERSION"
            if [ -n "$was" ] && [ "$(printf '%s\n%s\n' "$was" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] && [ "$was" != "$VERSION" ]; then
              echo "::warning title=Publishing an older build::The release carries $was and this run publishes $VERSION, which sorts below it. Installed apps will not downgrade; a fresh install would get the older build until the next merge."
            fi
          else
            echo "no manifest on the release yet; this is the first"
          fi
          rm -rf previous
      - name: Measure, sign, and write the manifest
        working-directory: dist
        env:
          ARBOS_UPDATE_SIGNING_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          ls -la
          shopt -s nullglob
          mac=(*-macos-*-app.tar.gz)
          linux=(*-linux-*.tar.gz)
          if [ "${#mac[@]}" -ne 1 ] || [ "${#linux[@]}" -ne 1 ]; then
            echo "::error title=Payloads missing::expected one macOS app tarball and one Linux tarball, found: $(ls)"
            exit 1
          fi
          printf '%s\n' "$NOTES" > notes.txt
          ../app/target/debug/arbos-updatectl sign \
            --manifest manifest.json \
            --version "$VERSION" \
            --commit "$SHORT" \
            --notes-file notes.txt \
            --artifact "${mac[0]}" \
            --artifact "${linux[0]}"
          rm -f notes.txt
          cat manifest.json
      # The key that signed is the key the app has, proven here and not on a
      # user's machine. A manifest that fails this never leaves the runner.
      - name: Verify the manifest against the compiled-in public key
        working-directory: dist
        run: |
          set -euo pipefail
          if ! ../app/target/debug/arbos-updatectl verify --manifest manifest.json --dir .; then
            echo "::error title=Signing key mismatch::The manifest signed with ARBOS_UPDATE_SIGNING_KEY does not verify against app/crates/update/update-key.pub. The secret and the committed public key are not two halves of one key; nothing was published."
            exit 1
          fi
      # The new release starts life as a draft under the staging name, and
      # the payloads go onto it while the old `edge` release is still serving.
      # A draft left behind by an earlier run that died mid-upload is swept
      # first, so they do not pile up unseen.
      - name: Stage the new release as a draft
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$STAGING\") | .id" |
          while read -r id; do
            echo "removing a leftover draft ($id)"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$STAGING" \
            -f target_commitish="$SHA" \
            -f name="Arbos edge" \
            -f body="Staging $VERSION." \
            -F draft=true \
            -F prerelease=true \
            --jq '"draft " + (.id | tostring) + " created"'
          gh release upload "$STAGING" ./*.tar.gz manifest.json latest.txt
          # The notarization logs of an unstapled build go up beside it.
          shopt -s nullglob
          logs=(notarization-*.log)
          if [ "${#logs[@]}" -gt 0 ]; then
            gh release upload "$STAGING" "${logs[@]}"
          fi
          # The same asset names the old release had: the two documents the
          # app reads and the two payloads the manifest names and signs.
          gh release view "$STAGING" --json assets -q '.assets[].name' | sort
      # The swap. Everything is up, so the old release goes, its tag goes with
      # it, and the draft becomes `edge` at the commit that was built — which
      # creates the tag there. The channel is dark for the second between.
      - name: Publish it as edge
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          published="$(date -u +'%Y-%m-%d %H:%M UTC')"
          commit_url="https://github.com/$REPO/commit/$SHA"
          manifest_url="https://github.com/$REPO/releases/download/$TAG/manifest.json"
          # The page says what the newest build is and when, so the releases
          # list reads as a release and not as a bucket.
          {
            printf '**%s** — built from [`%s`](%s), published %s.\n\n' "$VERSION" "$SHORT" "$commit_url" "$published"
            printf '%s\n\n' "$NOTES"
            printf 'Every green commit on `main`, published for the Arbos app'"'"'s own updater. The release is rebuilt on each publish and the tag moves to the commit that was built; the download URLs do not change.\n\n'
            printf 'macOS signature: `%s`. Notarized: `%s`.\n\n' "${SIGNING:-unknown}" "${NOTARIZED:-false}"
            if [ "${NOTARIZED:-false}" = "true" ] && [ "${STAPLED:-true}" != "true" ]; then
              printf 'Not stapled: Apple accepted this build but its ticket service was unreachable when the ticket was fetched, so the ticket is not inside the bundle. Gatekeeper fetches it online on first launch; the notarization log is attached below.\n\n'
            fi
            printf 'Manifest: <%s>\n' "$manifest_url"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "no $TAG release to replace"
          fi
          # The tag can outlive its release — a hand-made tag, or a run that
          # stopped right here — and publishing onto an existing tag would
          # leave it where it is instead of moving it to this commit.
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
          fi
          gh release edit "$STAGING" \
            --tag "$TAG" \
            --target "$SHA" \
            --draft=false \
            --prerelease \
            --title "Arbos edge" \
            --notes-file release-notes.md
          rm -f release-notes.md
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,targetCommitish,publishedAt
          {
            echo "### Release main"
            echo
            echo "Published \`$VERSION\` (\`$SHORT\`) at $published."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| macOS signature | \`${SIGNING:-unknown}\` |"
            echo "| Notarized | \`${NOTARIZED:-false}\` |"
            echo "| Stapled | \`${STAPLED:-${NOTARIZED:-false}}\` |"
            echo "| Manifest | <$manifest_url> |"
            if [ "${NOTARIZED:-false}" != "true" ]; then
              echo
              echo "> The in-app updater installs this. A copy downloaded in a browser would be stopped by Gatekeeper until a Developer ID Application certificate is in \`DEVELOPER_ID_CERT_P12\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
