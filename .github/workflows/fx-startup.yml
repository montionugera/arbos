name: fx startup

# fx/.github/workflows/bench.yml does not run from the monorepo root.
# This job is that workflow's Linux startup budget, with the working
# directory set to fx/ so the benchmark scripts find the binary.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fx-startup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Startup Latency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          use-cache: false

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Install hyperfine
        working-directory: ${{ github.workspace }}
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine_1.19.0_amd64.deb
          sudo dpkg -i hyperfine_1.19.0_amd64.deb

      - name: Run benchmarks
        run: ./benchmarks/startup.sh --ci

      - name: Enforce latency budgets
        run: python3 benchmarks/check_budgets.py
