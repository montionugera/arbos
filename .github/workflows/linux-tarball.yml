name: Linux tarball

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish the Linux tarball
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - name: Package the Linux build
        working-directory: app
        env:
          PROFILE: debug
        run: |
          set -euo pipefail
          # The fourth version component is the commit count. A new commit on
          # main is a newer build, so the update strip can offer a restart.
          ARBOS_BUILD="$(git rev-list --count HEAD)"
          export ARBOS_BUILD
          scripts/package-linux.sh
      - name: Merge the release manifest
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(tr -d '\n' < target/package/version.txt)
          arch=$(uname -m)
          name="arbos-${ver}-linux-${arch}.tar.gz"
          tarball="target/package/${name}"
          test -f "$tarball"
          digest=$(sha256sum "$tarball" | cut -d' ' -f1)
          # The Mac workflow publishes to the same manifest. Start from the
          # one on the release so its entries survive instead of overwriting it.
          scripts/ci/fetch-release-manifest.sh edge target/package
          scripts/ci/merge-release-manifest.py target/package/manifest.json "$ver" "${name}=${digest}"
      - name: Refuse a Mac artifact
        working-directory: app
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=()
          for path in target/package/*; do
            base=$(basename "$path")
            lower=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *.dmg|*macos*|*darwin*|*.app|*.app.tar.gz)
                found+=("$base")
                ;;
            esac
          done
          if (( ${#found[@]} )); then
            echo "refusing to upload a Mac artifact: ${found[*]}"
            exit 1
          fi
      - name: Publish to the edge release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(tr -d '\n' < target/package/version.txt)
          arch=$(uname -m)
          name="arbos-${ver}-linux-${arch}.tar.gz"
          cd target/package
          test -f "$name"
          test -f manifest.json
          test -f latest.txt
          notes="Arbos edge builds from main. The Linux tarball is published by the Linux tarball workflow. The Mac app is published by the macOS release workflow, signed and notarized."
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge \
              --title "Arbos edge" \
              --notes "$notes" \
              --target "${{ github.event.workflow_run.head_sha }}"
          fi
          gh release upload edge "$name" manifest.json latest.txt --clobber
          # `gh release view` reports a GraphQL node id. The delete route
          # needs the numeric id in the asset API URL.
          old="zeron-${ver}-linux-${arch}.tar.gz"
          gh release view edge --json assets --jq ".assets[] | select(.name==\"${old}\") | .apiUrl" | while IFS= read -r api_url; do
            [ -n "$api_url" ] || continue
            gh api -X DELETE "$api_url"
          done
