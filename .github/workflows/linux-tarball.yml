name: Linux tarball

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish the Linux tarball
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - name: Package the Linux build
        working-directory: app
        env:
          PROFILE: debug
        run: scripts/package-linux.sh
      - name: Write the release manifest
        working-directory: app
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          name="zeron-${ver}-linux-${arch}.tar.gz"
          tarball="target/package/${name}"
          test -f "$tarball"
          python3 - "$ver" "$name" "$tarball" <<'PY'
          import hashlib, json, pathlib, sys
          version, name, tarball = sys.argv[1:]
          path = pathlib.Path(tarball)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {"version": version, "files": {name: {"sha256": digest}}}
          pathlib.Path("target/package/manifest.json").write_text(json.dumps(manifest) + "\n")
          pathlib.Path("target/package/latest.txt").write_text(version + "\n")
          print(name)
          print(digest)
          PY
      - name: Refuse a Mac artifact
        working-directory: app
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=()
          for path in target/package/*; do
            base=$(basename "$path")
            lower=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *.dmg|*macos*|*darwin*|*.app|*.app.tar.gz)
                found+=("$base")
                ;;
            esac
          done
          if (( ${#found[@]} )); then
            echo "refusing to upload a Mac artifact: ${found[*]}"
            exit 1
          fi
      - name: Publish to the edge release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          name="zeron-${ver}-linux-${arch}.tar.gz"
          cd target/package
          test -f "$name"
          test -f manifest.json
          test -f latest.txt
          notes="Linux tarball only. This release does not include a Mac disk image or an unsigned Mac build."
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge \
              --title "Linux edge" \
              --notes "$notes" \
              --target "${{ github.event.workflow_run.head_sha }}"
          fi
          gh release upload edge "$name" manifest.json latest.txt --clobber
